<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS Home</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f5f7fb;
}

/* Navbar */
nav{
    background:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

nav a{
    text-decoration:none;
    margin-left:15px;
    color:black;
}

/* Hero */
.hero{
    padding:60px;
    text-align:center;
}

.hero h1{
    font-size:36px;
}

.hero p{
    color:#555;
}

.hero button{
    padding:10px 20px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:5px;
    margin-top:15px;
}

/* Features */
.features{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:40px;
}

.box{
    background:white;
    padding:20px;
    width:200px;
    text-align:center;
    border-radius:8px;
}

/* Footer */
footer{
    background:#111;
    color:white;
    text-align:center;
    padding:15px;
}
</style>
</head>

<body>

<nav>
    <b>SaaSify</b>
    <div>
        <a href="#">Home</a>
        <a href="#">Features</a>
        <a href="#">Contact</a>
    </div>
</nav>

<section class="hero">
    <h1>Grow Your Business</h1>
    <p>Simple SaaS solution to manage your work</p>
    <button>Get Started</button>
</section>

<section class="features">
    <div class="box">Analytics</div>
    <div class="box">Automation</div>
    <div class="box">Security</div>
</section>

<footer>
    © 2025 SaaSify
</footer>

</body>
</html>
